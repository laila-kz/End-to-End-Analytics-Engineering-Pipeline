version: 2

models:
  - name: fct_trips
    description: "Fact model at the taxi trip grain, based on enriched trip data from int_trips_enriched."
    columns:
      - name: trip_sk
        description: "Deterministic surrogate key for each trip fact record."
        tests:
          - not_null
          - unique

      - name: pickup_date
        description: "Pickup date for the taxi trip."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day

      - name: dropoff_date
        description: "Dropoff date for the taxi trip."

      - name: pickup_zone_sk
        description: "Surrogate key for the pickup taxi zone dimension."
        tests:
          - not_null
          - relationships:
              to: ref('dim_taxi_zone')
              field: taxi_zone_sk

      - name: dropoff_zone_sk
        description: "Surrogate key for the dropoff taxi zone dimension."
        tests:
          - not_null
          - relationships:
              to: ref('dim_taxi_zone')
              field: taxi_zone_sk

      - name: revenue_before_tip
        description: "Trip revenue before tip."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: revenue_with_tip
        description: "Trip revenue including tip."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fct_daily_summary
    description: "Daily summary fact model aggregated by pickup date, pickup zone, and payment type."
    columns:
      - name: day_zone_payment_sk
        description: "Deterministic surrogate key for the daily summary record."
        tests:
          - not_null
          - unique

      - name: date_day
        description: "Date of the aggregated bucket."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day

      - name: pickup_zone_sk
        description: "Surrogate key for the pickup zone dimension."
        tests:
          - not_null
          - relationships:
              to: ref('dim_taxi_zone')
              field: taxi_zone_sk

      - name: total_revenue
        description: "Total revenue for the daily summary bucket, including tips."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: avg_fare
        description: "Average fare per trip in the daily summary bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= -0.000001"

      - name: avg_distance
        description: "Average distance per trip in the daily summary bucket."

