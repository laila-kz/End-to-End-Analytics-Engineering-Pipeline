version: 2

models:
  - name: fct_trips
    description: "Fact model at the taxi trip grain, based on enriched trip data from int_trips_enriched."
    columns:
      - name: trip_sk
        description: "Deterministic surrogate key for each trip fact record."
        tests:
          - not_null
          - unique
      - name: pickup_date
        description: "Pickup date for the taxi trip."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: dropoff_date
        description: "Dropoff date for the taxi trip."
      - name: pickup_zone_sk
        description: "Surrogate key for the pickup taxi zone dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_taxi_zone')
                field: taxi_zone_sk
      - name: dropoff_zone_sk
        description: "Surrogate key for the dropoff taxi zone dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_taxi_zone')
                field: taxi_zone_sk
      - name: payment_code
        description: "Numeric payment type code used for trip-level payment type analysis."
      - name: revenue_before_tip
        description: "Trip revenue before tip."
      - name: revenue_with_tip
        description: "Trip revenue including tip."
      - name: trip_distance_miles
        description: "Total distance traveled during the trip in miles."
      - name: trip_duration_minutes
        description: "Duration of the trip in minutes."
      - name: average_speed_mph
        description: "Average speed during the trip in miles per hour."

  - name: fct_daily_summary
    description: "Daily summary fact model aggregated by pickup date, pickup zone, and payment type."
    columns:
      - name: day_zone_payment_sk
        description: "Deterministic surrogate key for the daily summary record."
        tests:
          - not_null
          - unique
      - name: date_day
        description: "Date of the aggregated bucket."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: pickup_zone_sk
        description: "Surrogate key for the pickup zone dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_taxi_zone')
                field: taxi_zone_sk
      - name: pickup_zone_id
        description: "Taxi zone ID for the pickup zone used in aggregation."
      - name: payment_code
        description: "Numeric payment type code used for aggregation."
      - name: trip_count
        description: "Number of trips in the daily summary bucket."
      - name: total_revenue
        description: "Total revenue for the daily summary bucket, including tips."
      - name: avg_fare
        description: "Average fare per trip in the daily summary bucket."
      - name: avg_distance
        description: "Average distance per trip in the daily summary bucket."
