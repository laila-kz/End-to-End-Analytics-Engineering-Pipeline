# =============================================================================
# FILE: models/staging/_sources.yml
# PURPOSE: Declares the raw source tables that dbt will read.
#          Also defines freshness thresholds so dbt alerts you if data is stale.
#
# WHAT IS A SOURCE?
#   A source is a raw table that EXISTS BEFORE dbt runs.
#   It lives in Snowflake RAW.TAXI and was loaded by your data pipeline.
#   dbt uses {{ source('taxi', 'trips') }} in SQL to reference these.
#
# FRESHNESS CHECKS:
#   dbt source freshness checks the _loaded_at column to see when data last arrived.
#   Run: `dbt source freshness` to trigger this check.
# =============================================================================

version: 2

sources:
  - name: taxi                              # Source name — used in {{ source('taxi', ...) }}
    database: RAW                           # Snowflake database
    schema: TAXI                            # Snowflake schema
    description: >
      Raw NYC Yellow Taxi trip data loaded from NYC TLC public dataset.
      Data is loaded daily via Snowflake COPY INTO from staged Parquet files.
      Source: https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page

    config:
      freshness:
        warn_after:  {count: 25, period: hour}   # Warn if no new data in 25 hours
        error_after: {count: 49, period: hour}   # Error if no new data in 49 hours
      loaded_at_field: _loaded_at

    tables:
      # --------------------------------------------------------
      # SOURCE TABLE 1: TRIPS
      # --------------------------------------------------------
      - name: trips
        identifier: TRIPS             # Actual table name in Snowflake (case-insensitive)
        description: >
          Raw NYC Yellow Taxi trip records. Each row represents one completed taxi trip.
          Includes pickup/dropoff times, location IDs, fare breakdown, and payment info.
          Data covers Yellow Taxi only (not Green Taxi or FHV).
          Partitioned by tpep_pickup_datetime month in the source files.

        # Override freshness per-table (trips is loaded daily, zones are static)
        config:
          freshness:
            warn_after:  {count: 25, period: hour}
            error_after: {count: 49, period: hour}

        columns:
          - name: VENDORID
            description: >
              ID of the TPEP (Taxicab & Limousine Commission Electronic Payment)
              provider that provided the record. 1=Creative Mobile Technologies, 2=VeriFone Inc.

          - name: TPEP_PICKUP_DATETIME
            description: Date and time when the meter was engaged (trip started)
            tests:
              - not_null

          - name: TPEP_DROPOFF_DATETIME
            description: Date and time when the meter was disengaged (trip ended)
            tests:
              - not_null

          - name: PASSENGER_COUNT
            description: Number of passengers in the vehicle (driver-entered value)

          - name: TRIP_DISTANCE
            description: Elapsed trip distance in miles reported by the taximeter

          - name: RATECODEID
            description: >
              Final rate code in effect at end of trip.
              1=Standard rate, 2=JFK, 3=Newark, 4=Nassau/Westchester,
              5=Negotiated fare, 6=Group ride

          - name: STORE_AND_FWD_FLAG
            description: >
              Whether the trip record was held in vehicle memory before sending to vendor
              because vehicle did not have a server connection (Y=store and forward, N=not)

          - name: PULOCATIONID
            description: TLC Taxi Zone ID where the meter was engaged (pickup location)
            tests:
              - not_null

          - name: DOLOCATIONID
            description: TLC Taxi Zone ID where the meter was disengaged (dropoff location)
            tests:
              - not_null

          - name: PAYMENT_TYPE
            description: >
              Numeric code for how the passenger paid.
              1=Credit card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided trip

          - name: FARE_AMOUNT
            description: >
              Time-and-distance fare calculated by the meter (does not include tips,
              surcharges, or tolls)

          - name: EXTRA
            description: >
              Miscellaneous extras and surcharges. Currently includes only the
              $0.50 and $1 rush hour and overnight charges

          - name: MTA_TAX
            description: $0.50 MTA tax that is automatically triggered based on the metered rate

          - name: TIP_AMOUNT
            description: >
              Tip amount. This field is automatically populated for credit card tips.
              Cash tips are not included.

          - name: TOLLS_AMOUNT
            description: Total amount of all tolls paid in trip

          - name: IMPROVEMENT_SURCHARGE
            description: $0.30 improvement surcharge assessed trips at the flag drop

          - name: TOTAL_AMOUNT
            description: Total amount charged to passengers (does not include cash tips)

          - name: CONGESTION_SURCHARGE
            description: >
              Total amount collected in trip for NYS congestion surcharge
              ($2.50 for shared rides, $2.75 for non-shared rides into Manhattan below 96th St)

          - name: AIRPORT_FEE
            description: >
              $1.25 for pick up only at LaGuardia and John F. Kennedy Airports

          - name: _LOADED_AT
            description: Timestamp when this row was loaded into Snowflake (metadata column)

          - name: _SOURCE_FILE
            description: Name of the source Parquet file this row came from (metadata column)

