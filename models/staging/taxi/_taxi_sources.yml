# =============================================================================
# FILE: models/staging/_sources.yml
# PURPOSE: Declares the raw source tables that dbt will read.
#          Also defines freshness thresholds so dbt alerts you if data is stale.
#
# WHAT IS A SOURCE?
#   A source is a raw table that EXISTS BEFORE dbt runs.
#   It lives in Snowflake RAW.TAXI and was loaded by your data pipeline.
#   dbt uses {{ source('taxi', 'trips') }} in SQL to reference these.
#
# FRESHNESS CHECKS:
#   dbt source freshness checks the _loaded_at column to see when data last arrived.
#   Run: `dbt source freshness` to trigger this check.
# =============================================================================

version: 2

sources:
  - name: taxi                              # Source name — used in {{ source('taxi', ...) }}
    database: RAW                           # Snowflake database
    schema: TAXI                            # Snowflake schema
    description: >
      Raw NYC Yellow Taxi trip data loaded from NYC TLC public dataset.
      Data is loaded daily via Snowflake COPY INTO from staged Parquet files.
      Source: https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page

    config:
      freshness:
        warn_after: null           # Don't warn (static dev data)
        error_after: null          # Don't error (static dev data)
      loaded_at_field: 'VARIANT_COL:"_LOADED_AT"'

    tables:
      # --------------------------------------------------------
      # SOURCE TABLE 1: TRIPS
      # --------------------------------------------------------
      - name: trips
        identifier: TRIPS             # Actual table name in Snowflake (case-insensitive)
        description: >
          Raw NYC Yellow Taxi trip records. Each row represents one completed taxi trip.
          Includes pickup/dropoff times, location IDs, fare breakdown, and payment info.
          Data covers Yellow Taxi only (not Green Taxi or FHV).
          Partitioned by tpep_pickup_datetime month in the source files.

        # Override freshness per-table (trips is loaded daily, zones are static)
        config:
          freshness:
            warn_after: null
            error_after: null

        columns:
          - name: VARIANT_COL
            description: >
              Semi-structured data column containing JSON with taxi trip details.
              Accessed via VARIANT_COL:"column_name" syntax in SQL.

